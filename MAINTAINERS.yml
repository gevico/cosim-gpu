# SPDX-License-Identifier: Apache-2.0
#
# This file records who maintains which part of cosim-gpu. It is parsed by
# scripts/host/get_maintainer.py and used by the "Maintainers" CI job and the
# "Pull Request/Issue Assigner" workflow. The format follows Zephyr's
# MAINTAINERS.yml.
#
# File format
# ###########
#
# "Area title" (quotes are only needed for titles with special characters,
#  like colons):
#     status:
#         One of the following:
#
#         * maintained:
#             The area has a maintainer who looks after it.
#
#         * odd fixes:
#             The area gets odd fixes and may have collaborators.
#
#         * unmaintained:
#             Nobody looks after the area.
#
#         * obsolete:
#             Old code that has been replaced by something better.
#
#     maintainers:
#         List of GitHub handles of the people who maintain the area.
#
#     collaborators:
#         GitHub handles of very involved contributors who know the area
#         well and review changes to it.
#
#     inform:
#         GitHub handles of people to keep informed about changes.
#
#     labels:
#         GitHub labels to add to pull requests that modify the area.
#
#     files:
#         Paths and/or glob patterns relative to the repository root.
#         A pattern ending in '/' matches every file in that directory;
#         other patterns must match exactly. Directory paths always end
#         in '/'. Submodules are single gitlink paths, so list them with
#         'files-regex' (e.g. '^gem5$').
#
#     files-regex:
#         Regular expressions matched against repository paths. They may
#         match anywhere unless anchored with ^ and $.
#
#     files-exclude, files-regex-exclude:
#         Like 'files' and 'files-regex', but matching files are removed
#         from the area.
#
#     file-groups:
#         Groups of files inside the area with their own collaborators:
#         - name: <group name>
#           description: <text>
#           collaborators: [<GitHub handle>, ...]
#           files: [...]
#           files-regex: [...]
#           files-exclude: [...]
#           files-regex-exclude: [...]
#
#     description: >-
#         Plain-English description of the area.
#
# Every area needs 'files', 'files-regex' or 'file-groups'. Every tracked
# file must belong to at least one area; `just check-maintainers` enforces
# this in CI.
#
# Workflow
# ########
#
# When a pull request to main is opened or updated:
#
#     * The maintainers of the most affected area are assigned to it.
#
#     * The maintainers and collaborators of every affected area are
#       requested as reviewers, except the pull request author.
#
#     * The labels of every affected area are added to it.
#
# When MAINTAINERS.yml itself changes, the maintainers of the changed areas
# are requested as reviewers, and every newly added maintainer or
# collaborator must have at least triage access to the repository.
#
# Areas are sorted by name.

"Accelerator Backend: gem5 MI300X GPU":
  status: maintained
  maintainers:
    - zevorn
    - fengyuanyu1
  files-regex:
    - ^third_party/gem5$
  labels:
    - "area: gem5 GPU backend"
  description: >-
    gem5 MI300X GPU model used as the accelerator backend behind the QEMU
    vfio-user device.

