# SPDX-License-Identifier: Apache-2.0
# Requires QEMU built with --enable-vfio-user-server (just build-qemu).
version: 1
templates:
  qemu-edu:
    kind: qemu-device
    runtime:
      binary: build/qemu/qemu-system-x86_64
    args:
      device: {driver: edu}
  qemu-edu-aarch64:
    use: qemu-edu
    runtime:
      binary: build/qemu/qemu-system-aarch64
