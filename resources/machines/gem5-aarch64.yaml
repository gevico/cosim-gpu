# Paused ARM64 vHost with one native ARM64 gem5 MI300X process.
version: 1
imports:
  - vhosts/qemu.yaml
  - vhosts/vhost-arm-tcg.yaml
  - devices/gpu/mi300x.yaml
machines:
  - id: m0
    vhost:
      use: vhost-arm-tcg
      runtime: {binary: build/qemu/qemu-system-aarch64}
      memory: 512M
    devices:
      - use: mi300x-aarch64
        id: gpu0
        memory_regions: [{name: vram, size: 1G}]
        args: {num_compute_units: 4}
