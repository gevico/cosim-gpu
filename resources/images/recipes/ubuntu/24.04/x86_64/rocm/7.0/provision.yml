# SPDX-License-Identifier: Apache-2.0
- name: Provision the selected vHost image recipe
  hosts: default
  become: true
  gather_facts: true
  tasks:
    - name: Validate the recipe base distribution
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "24.04"
        fail_msg: "This recipe requires Ubuntu 24.04."

    - name: Create the cosim build user
      ansible.builtin.user:
        name: gem5
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true

    - name: Create the Packer build temporary directory
      ansible.builtin.file:
        path: /home/gem5/build-tmp
        state: directory
        owner: gem5
        group: gem5
        mode: "0755"

    - name: Install the selected vHost kernel and build dependencies
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 1800
        state: present
        name:
          - "linux-image-{{ cosim_recipe_variables.kernel_release }}"
          - "linux-headers-{{ cosim_recipe_variables.kernel_release }}"
          - "linux-modules-extra-{{ cosim_recipe_variables.kernel_release }}"
          - build-essential
          - cmake
          - gpg
          - git
          - vim
          - python3-pip
          - pciutils

    - name: Create the APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the AMD package signing key
      ansible.builtin.get_url:
        url: https://repo.radeon.com/rocm/rocm.gpg.key
        dest: /etc/apt/keyrings/rocm.gpg.asc
        owner: root
        group: root
        mode: "0644"

    - name: Convert the AMD package signing key
      ansible.builtin.command:
        argv:
          - gpg
          - --dearmor
          - --batch
          - --yes
          - --output
          - /etc/apt/keyrings/rocm.gpg
          - /etc/apt/keyrings/rocm.gpg.asc
      changed_when: false

    - name: Configure the AMDGPU package repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg]
          https://repo.radeon.com/amdgpu/{{ cosim_recipe.software_release }}/ubuntu
          {{ cosim_recipe_variables.rocm_distribution }} main
        filename: amdgpu
        state: present

    - name: Configure the ROCm package repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg]
          https://repo.radeon.com/rocm/apt/{{ cosim_recipe.software_release }}
          {{ cosim_recipe_variables.rocm_distribution }} main
        filename: rocm
        state: present

    - name: Set AMD package priority
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/rocm-pin-600
        owner: root
        group: root
        mode: "0644"
        content: |-
          Package: *
          Pin: release o=repo.radeon.com
          Pin-Priority: 600

    - name: Install and build the AMDGPU DKMS module
      block:
        - name: Install the AMDGPU DKMS package
          ansible.builtin.apt:
            update_cache: true
            state: present
            name: "amdgpu-dkms={{ cosim_recipe_variables.amdgpu_dkms_version }}"

        - name: Run DKMS autoinstall for the selected kernel
          ansible.builtin.command:
            argv:
              - dkms
              - autoinstall
              - -k
              - "{{ cosim_recipe_variables.kernel_release }}"
      rescue:
        - name: Find AMDGPU DKMS build logs
          ansible.builtin.find:
            paths: /var/lib/dkms/amdgpu
            patterns: make.log
            recurse: true
          register: amdgpu_dkms_logs
          failed_when: false

        - name: Read AMDGPU DKMS build logs
          ansible.builtin.command:
            argv:
              - cat
              - "{{ item.path }}"
          loop: "{{ amdgpu_dkms_logs.files | default([]) }}"
          register: amdgpu_dkms_log_output
          changed_when: true
          failed_when: false

        - name: Display AMDGPU DKMS build logs
          ansible.builtin.debug:
            msg: "{{ item.stdout }}"
          loop: "{{ amdgpu_dkms_log_output.results | default([]) }}"

        - name: Report AMDGPU DKMS build failure
          ansible.builtin.fail:
            msg: >-
              AMDGPU DKMS provisioning failed during {{ ansible_failed_task.name }}
              for kernel {{ cosim_recipe_variables.kernel_release }}; inspect the
              build log output above.

    - name: Install the ROCm stack
      ansible.builtin.apt:
        state: present
        name: rocm

    - name: Create the serial getty override directory
      ansible.builtin.file:
        path: /etc/systemd/system/serial-getty@ttyS0.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install recipe files
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "{{ item.destination }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - source: "{{ playbook_dir }}/files/serial-getty-override.conf"
          destination: /etc/systemd/system/serial-getty@ttyS0.service.d/override.conf
          mode: "0644"
        - {source: "{{ playbook_dir }}/files/cosim-gpu-initialize.service", destination: /lib/systemd/system/cosim-gpu-initialize.service, mode: "0644"}
        - {source: "{{ playbook_dir }}/files/cosim_gpu_initialize.sh", destination: /usr/local/bin/cosim-gpu-initialize.sh, mode: "0755"}
        - {source: "{{ playbook_dir }}/files/cosim_rocm_regression.sh", destination: /usr/local/bin/cosim-rocm-regression.sh, mode: "0755"}

    - name: Create firmware directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /root/roms
        - /usr/lib/firmware/amdgpu

    - name: Install MI200 and MI300 firmware inputs
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "{{ item.destination }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - {source: "{{ cosim_provision_files.mi200_rom }}", destination: /root/roms/mi200.rom}
        - {source: "{{ cosim_provision_files.mi300_rom }}", destination: /root/roms/mi300.rom}
        - {source: "{{ cosim_provision_files.mi300_discovery }}", destination: /usr/lib/firmware/amdgpu/mi300_discovery}
        - {source: "{{ cosim_provision_files.mi350_discovery }}", destination: /usr/lib/firmware/amdgpu/mi350_discovery}

    - name: Create the initial AMD IP discovery file
      ansible.builtin.file:
        path: /usr/lib/firmware/amdgpu/ip_discovery.bin
        state: touch
        owner: root
        group: root
        mode: "0644"

    - name: Extract the selected vHost kernel
      ansible.builtin.shell:
        cmd: >-
          /usr/src/linux-headers-{{ cosim_recipe_variables.kernel_release }}/scripts/extract-vmlinux
          /boot/vmlinuz-{{ cosim_recipe_variables.kernel_release }}
          > /home/gem5/vmlinux-gpu-ml
        creates: /home/gem5/vmlinux-gpu-ml

    - name: Record the selected vHost kernel release
      ansible.builtin.copy:
        dest: /home/gem5/kernel-release
        owner: root
        group: root
        mode: "0644"
        content: "{{ cosim_recipe_variables.kernel_release }}\n"

    - name: Inspect the installed AMDGPU module
      ansible.builtin.command:
        argv:
          - modinfo
          - -k
          - "{{ cosim_recipe_variables.kernel_release }}"
          - amdgpu
      register: amdgpu_module_info
      changed_when: false

    - name: Inspect the AMDGPU DKMS state
      ansible.builtin.command:
        argv:
          - dkms
          - status
      register: amdgpu_dkms_status
      changed_when: false

    - name: Verify the AMDGPU DKMS module matches the selected kernel
      ansible.builtin.assert:
        that:
          - "'/updates/dkms/amdgpu.ko' in amdgpu_module_info.stdout"
          - "cosim_recipe_variables.kernel_release in amdgpu_module_info.stdout"
        fail_msg: >-
          The selected kernel does not have a matching AMDGPU DKMS module.
          modinfo={{ amdgpu_module_info.stdout }}
          dkms={{ amdgpu_dkms_status.stdout }}

    - name: Save AMDGPU module metadata
      ansible.builtin.copy:
        dest: /home/gem5/amdgpu-module.txt
        owner: root
        group: root
        mode: "0644"
        content: "{{ amdgpu_module_info.stdout }}\n"

    - name: Enable the cosim GPU initialization service
      ansible.builtin.systemd_service:
        name: cosim-gpu-initialize.service
        enabled: true
        daemon_reload: true

    - name: Install Python GPU packages
      ansible.builtin.apt:
        state: present
        name:
          - python3-pip

    - name: Install PyTorch for ROCm
      ansible.builtin.command:
        argv:
          - pip3
          - install
          - --break-system-packages
          - torch
          - torchvision
          - torchaudio
          - --index-url
          - "{{ cosim_recipe_variables.pytorch_index_url }}"
      changed_when: true

    - name: Record installed packages
      ansible.builtin.shell:
        cmd: "dpkg-query -W -f='${Package}\t${Version}\n' > /home/gem5/image-packages.tsv"
      changed_when: false

    - name: Record installed Python packages
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - pip
          - list
          - --format=json
      register: python_packages
      changed_when: false

    - name: Save installed Python packages
      ansible.builtin.copy:
        dest: /home/gem5/python-packages.json
        owner: root
        group: root
        mode: "0644"
        content: "{{ python_packages.stdout }}\n"

    - name: Record the ROCm compiler version
      ansible.builtin.shell:
        cmd: /opt/rocm/bin/hipcc --version > /home/gem5/hipcc-version.txt
      changed_when: false

    - name: Clean package and pip caches
      ansible.builtin.shell:
        cmd: apt-get clean && rm -rf /root/.cache/pip && fstrim -av
      changed_when: true

    - name: Fetch declared result files from the vHost
      ansible.builtin.fetch:
        src: "{{ item.guest_path }}"
        dest: "{{ cosim_result_directory }}/{{ item.name }}"
        flat: true
      loop: "{{ cosim_result_files }}"
