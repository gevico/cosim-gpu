# SPDX-License-Identifier: Apache-2.0
name: Image recipe

on:
  workflow_call:
    inputs:
      recipe:
        description: Image recipe identifier under resources/images/recipes
        required: true
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  image:
    name: Image preparation and GPU regression
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      COSIM_ENV: host
      COSIM_DEV_IMAGE: cosim-dev:ci
      RECIPE: ${{ inputs.recipe }}
      COSIM_ROCM_IMAGE_EPOCH: ${{ vars.COSIM_ROCM_IMAGE_EPOCH || '1' }}
      COSIM_ARTIFACT_HEAD_REPO: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
      COSIM_ARTIFACT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.51.0
      - name: Resolve the recipe output directory
        id: recipe
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import hashlib
          import os
          from pathlib import Path
          from resources.images.recipe import load_recipe
          identifier = os.environ["RECIPE"]
          print("tag=" + hashlib.sha256(identifier.encode()).hexdigest()[:16])
          recipe = load_recipe(Path.cwd(), identifier)
          print("directory=" + str(recipe.output_path(Path.cwd())))
          PYCODE
      - name: Prepare dedicated image-build host
        run: just ci-prepare-image-host "$RECIPE"
      - name: Initialize image sources
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 third_party/gem5-resources
      - name: Validate the real Packer builder and provisioners
        run: just check-rocm-image "$RECIPE"
      - name: Identify exact image inputs
        id: image-key
        run: |
          echo "key=$(just ci-rocm-assets key "$RECIPE")" >> "$GITHUB_OUTPUT"
          echo "epoch=$COSIM_ROCM_IMAGE_EPOCH" >> "$GITHUB_OUTPUT"
      - name: Find a verified image from the same source branch
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_KEY: ${{ steps.image-key.outputs.key }}
        run: just ci-find-rocm-artifact "$IMAGE_KEY" artifacts/rocm-selection.json "$RECIPE" >> "$GITHUB_OUTPUT"
      - name: Download the retained image
        if: steps.retained.outputs.artifact-id != ''
        id: download-image
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.retained.outputs.artifact-id }}
          run-id: ${{ steps.retained.outputs.run-id }}
          path: ${{ steps.retained.outputs.download-dir }}
          merge-multiple: true
      - name: Remove the incomplete retained download
        if: steps.download-image.outcome == 'failure'
        run: just ci-discard-rocm-download artifacts/rocm-selection.json
      - name: Verify and adopt the downloaded image
        if: steps.download-image.outcome == 'success'
        env:
          IMAGE_KEY: ${{ steps.image-key.outputs.key }}
          DOWNLOAD_DIR: ${{ steps.retained.outputs.download-dir }}
          IMAGE_DIRECTORY: ${{ steps.recipe.outputs.directory }}
        run: just ci-adopt-rocm-artifact "$DOWNLOAD_DIR" "$IMAGE_DIRECTORY" "$IMAGE_KEY" "$RECIPE"
      - name: Build or verify the selected recipe
        run: just build-rocm-assets "$RECIPE"
      - name: Verify reuse and corruption rejection with the built image
        env:
          IMAGE_DIRECTORY: ${{ steps.recipe.outputs.directory }}
        run: just test-rocm-assets "$IMAGE_DIRECTORY" "$RECIPE"
      - uses: actions/upload-artifact@v4
        with:
          name: rocm-guest-${{ steps.recipe.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.recipe.outputs.directory }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Collect image diagnostics without copying the disk or kernel
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import shutil
          from resources.images.recipe import load_recipe
          recipe = load_recipe(Path.cwd(), os.environ["RECIPE"])
          output = recipe.output_path(Path.cwd())
          destination = Path("artifacts/image-logs")
          destination.mkdir(parents=True, exist_ok=True)
          for path in output.glob("*"):
              if path.is_file() and path.name not in {"disk", recipe.kernel_file}:
                  shutil.copy2(path, destination / path.name)
          for logs in output.parent.glob(f"build-{output.name}-*/logs"):
              shutil.copytree(logs, destination / logs.parent.name)
          selection = Path("artifacts/rocm-selection.json")
          if selection.is_file():
              shutil.copy2(selection, destination / selection.name)
          PYCODE
      - name: Preserve image build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocm-image-logs-${{ steps.recipe.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify published image selection and source isolation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_KEY: ${{ steps.image-key.outputs.key }}
        run: just test-rocm-artifact "$IMAGE_KEY" artifacts/rocm-artifact-check "$RECIPE"
      - name: Preserve image selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocm-artifact-check-${{ steps.recipe.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rocm-artifact-check/
          if-no-files-found: warn
          retention-days: 14

      # Keep the verified disk local; hosted jobs cannot share a runner filesystem.
      - name: Initialize simulator sources for regression
        run: git submodule update --init --recursive --depth 1 third_party/gem5
      - name: Wait for this run's successful gem5 producer
        id: gem5
        env:
          GH_TOKEN: ${{ github.token }}
        run: just ci-wait-gem5 >> "$GITHUB_OUTPUT"
      - name: Download the verified gem5 runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.gem5.outputs.artifact-id }}
          path: build/ci-build
          merge-multiple: true
      - name: Restore verified gem5 and development image
        run: just ci-restore-gem5 build/ci-build
      - name: Verify session memory, MI300X model and vfio-user ROM
        env:
          COSIM_ENV: container
        run: |
          just test-cosim-memory
          just test-gem5-mi300x artifacts/rocm-regression/model
          just build-cosim
          just test-cosim-vfio-user
      - name: Run ROCm workloads with the local image
        env:
          COSIM_ENV: container
          IMAGE_DIRECTORY: ${{ steps.recipe.outputs.directory }}
        run: just test-rocm-regression artifacts/rocm-regression/guest "$IMAGE_DIRECTORY" "$RECIPE"
      - name: Upload complete regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rocm-regression-${{ steps.recipe.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rocm-regression/
            ${{ steps.recipe.outputs.directory }}/manifest.json
            build/ci-build/manifest.json
            !artifacts/rocm-regression/**/*.sock
          if-no-files-found: warn
          retention-days: 14
