# Fast checks on every push/PR (< 5 min, no submodules needed)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JUST_VERSION: 1.51.0

jobs:
  workflow-lint:
    name: GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "$archive"
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Check workflow syntax and expressions
        run: actionlint .github/workflows/*.yml

  rust:
    name: Rust Topology and Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Install QEMU for session tests
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils python3-pexpect python3-yaml
      - name: Check Rust source and topology behavior
        run: just check-cosim
      - name: Run sessions with QEMU processes, disks and signals
        run: just test-cosim-integration
      - name: Verify CI cancellation and log retention
        run: just test-session-lifecycle

  regression-runner:
    name: ROCm regression runner tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python CI dependencies
        run: pip install -r scripts/ci/requirements.txt
      - name: Install QEMU for session tests
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Check command completion and failure handling
        run: |
          mkdir -p artifacts/ci-check/scratch
          env TMPDIR="$PWD/artifacts/ci-check/scratch" \
            python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
  checkpatch:
    name: Checkpatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Run checkpatch on new commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          just check-patch "$base"

  maintainers:
    name: Maintainers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r scripts/ci/requirements.txt
      - name: Validate MAINTAINERS.yml and file coverage
        run: just check-maintainers

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Run ShellCheck
        run: just check-shell

  modprobe-params:
    name: Modprobe Params (Regression #9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Verify cosim modprobe parameters
        run: just check-modprobe-params

  kernel-compile:
    name: GPU Kernel Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Compile GPU kernels
        run: just build-gpu-tests
