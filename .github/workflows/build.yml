# SPDX-License-Identifier: Apache-2.0
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      recipe:
        description: Recipe to validate alone; leave empty for full regression
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Select image and regression checks
    runs-on: ubuntu-24.04
    outputs:
      baseline: ${{ steps.plan.outputs.baseline }}
      recipes: ${{ steps.plan.outputs.recipes }}
      regression: ${{ steps.plan.outputs.regression }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.51.0
      - name: Select checks from all changed paths
        id: plan
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_RECIPE: ${{ inputs.recipe }}
        run: |
          BASELINE="$(just --evaluate rocm_recipe)"
          export BASELINE
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          import subprocess
          from resources.images.recipe import list_recipes

          available = set(list_recipes(Path.cwd()))
          baseline = os.environ["BASELINE"]
          requested = os.environ["CI_RECIPE"]
          selected = set()
          full = False
          if requested:
              if requested not in available:
                  raise ValueError(f"unknown recipe: {requested}")
              selected.add(requested)
          else:
              base = os.environ["CI_BASE"]
              if not base or set(base) == {"0"}:
                  full = True
              else:
                  paths = subprocess.check_output([
                      "git", "diff", "--no-renames", "--name-only", "-z", base, "HEAD",
                  ]).split(b"\0")
                  for path in map(os.fsdecode, filter(None, paths)):
                      affected = {r for r in available
                                  if path.startswith(f"resources/images/recipes/{r}/")}
                      if affected:
                          selected.update(affected)
                      elif (not path.startswith("docs/")
                            and path not in {"README.md", "README.zh.md"}):
                          full = True
              if full:
                  selected = available - {baseline}
          print("baseline=" + baseline)
          print("regression=" + json.dumps(full))
          print("recipes=" + json.dumps(sorted(selected), separators=(",", ":")))
          PYCODE

  build-gem5:
    needs: changes
    if: needs.changes.outputs.regression == 'true'
    name: Build gem5 (VEGA_X86)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COSIM_ENV: container
      COSIM_DEV_IMAGE: cosim-dev:ci
      COSIM_GEM5_CACHE_EPOCH: ${{ vars.COSIM_GEM5_CACHE_EPOCH || '1' }}
    outputs:
      runtime-artifact: ${{ steps.runtime.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Init gem5 submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1 third_party/gem5

      - uses: extractions/setup-just@v4
        with:
          just-version: 1.51.0

      - name: Install the workflow parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Identify the complete gem5 build inputs
        id: build-key
        run: echo "key=$(just ci-gem5-key)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: gem5-cache
        with:
          path: build/cache/gem5-runtime/
          key: gem5-runtime-v2-${{ steps.build-key.outputs.key }}

      - name: Build the development image
        if: steps.gem5-cache.outputs.cache-hit != 'true'
        run: just dev-image

      - name: Build gem5
        if: steps.gem5-cache.outputs.cache-hit != 'true'
        run: just build-gem5 "$(nproc)" GOLD_LINKER=True --linker=gold

      - name: Verify binary
        if: steps.gem5-cache.outputs.cache-hit != 'true'
        run: test -f "$(just --evaluate gem5_build_dir)/gem5.opt"

      - name: Package gem5 and its runtime environment
        if: steps.gem5-cache.outputs.cache-hit != 'true'
        run: just ci-package-gem5 build/cache/gem5-runtime

      - uses: actions/cache/save@v4
        if: steps.gem5-cache.outputs.cache-hit != 'true'
        with:
          path: build/cache/gem5-runtime/
          key: gem5-runtime-v2-${{ steps.build-key.outputs.key }}

      - name: Publish a verified build for this workflow run
        run: just ci-reuse-gem5 build/cache/gem5-runtime build/ci-build

      - name: Verify runtime cache integrity and provenance
        run: just test-runtime-artifact build/cache/gem5-runtime build/ci-build

      - uses: actions/upload-artifact@v4
        id: runtime
        with:
          name: gem5-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-build/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  build-rocm:
    name: Build regression image
    needs: changes
    if: needs.changes.outputs.regression == 'true'
    uses: ./.github/workflows/image.yml
    with:
      recipe: ${{ needs.changes.outputs.baseline }}

  recipes:
    name: Check recipe (${{ matrix.recipe }})
    needs: changes
    if: needs.changes.outputs.recipes != '[]'
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.changes.outputs.recipes) }}
    uses: ./.github/workflows/image.yml
    with:
      recipe: ${{ matrix.recipe }}

  rocm:
    name: ROCm regression
    needs: [changes, build-gem5, build-rocm]
    if: needs.changes.outputs.regression == 'true'
    uses: ./.github/workflows/integration.yml
    with:
      runtime-artifact: ${{ needs.build-gem5.outputs.runtime-artifact }}
      guest-artifact: ${{ needs.build-rocm.outputs.guest-artifact }}
      image-key: ${{ needs.build-rocm.outputs.image-key }}
      image-epoch: ${{ needs.build-rocm.outputs.image-epoch }}

  regression:
    name: ROCm regression gate
    if: always()
    needs: [changes, recipes, build-gem5, build-rocm, rocm]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful checks
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
